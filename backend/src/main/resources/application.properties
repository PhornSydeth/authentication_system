# ==========================================
# SPRING BOOT APPLICATION CONFIGURATION
# ==========================================
spring.application.name=${SPRING_APPLICATION_NAME:authentication_system}
server.port=${SERVER_PORT:8080}

# ==========================================
# DATASOURCE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9090/AuthSystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:3014}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# REDIS CONFIGURATION (Caching & Rate Limiting)
# ==========================================
# FIXED: Added local fallback values so IntelliJ doesn't crash
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASS:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# ==========================================
# MAIL CONFIGURATION (Email Verification & OTP)
# ==========================================
# FIXED: Added local fallbacks to prevent startup crashes if unset locally
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# JWT CONFIGURATION (RS256 Asymmetric Cryptography)
# ==========================================
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# TWILIO CONFIGURATION (SMS/OTP - Reserved)
# ==========================================
twilio.account.sid=${TWILIO_ACCOUNT_SID:mock_sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:mock_token}

# ==========================================
# CORS CONFIGURATION (Frontend URLs)
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
