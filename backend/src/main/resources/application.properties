# ==========================================
# SPRING BOOT APPLICATION CONFIGURATION
# ==========================================

spring.application.name=${SPRING_APPLICATION_NAME:authentication_system}
server.port=${SERVER_PORT:8080}

# ==========================================
# DATASOURCE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9090/AuthSystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:3014}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# REDIS CONFIGURATION (Caching & Rate Limiting)
# ==========================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASS}
spring.data.redis.ssl.enabled=true

# ==========================================
# MAIL CONFIGURATION (Email Verification & OTP)
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# JWT CONFIGURATION (RS256 Asymmetric Cryptography)
# ==========================================
# HS256 secret is removed. RSA public/private keys are loaded from:
# - backend/src/main/resources/keys/private_key.pem (Private key for signing)
# - backend/src/main/resources/keys/public_key.pem (Public key for validation)
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ==========================================
# TWILIO CONFIGURATION (SMS/OTP - Reserved)
# ==========================================
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}

# ==========================================
# CORS CONFIGURATION (Frontend URLs)
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

